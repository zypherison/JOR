[package]
name = "jor"
version = "1.0.0"
description = "JOR — Just Open & Run: a blazing-fast launcher for Windows"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-autostart = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
fuzzy-matcher = "0.3.7"
bincode = "1.3.3"
dirs = "6.0.0"
opener = "0.8.4"
async-trait = "0.1.80"
arboard = "3.4.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
lazy_static = "1.4"
sysinfo = "0.33"
rand = "0.8"
futures = "0.3"

# Windows-only dependencies (icon extraction, GDI paste simulation).
# Kept out of the Linux/macOS dependency graph so cross-platform builds
# don't compile the large `windows` crate.
[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
windows = { version = "0.57.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
