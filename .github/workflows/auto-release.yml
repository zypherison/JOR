name: "Branch Auto Release"

# Builds the pushed branch and publishes a BRAND-NEW GitHub release on every
# push to ANY branch. Releases are tagged "<branch>.<iteration>" (e.g.
# optimized-overhaul.1, optimized-overhaul.2) so they can never collide with
# or modify existing releases such as the stable v1.0.0.
#
# Runs are serialized per branch (concurrency group) and the tag is guarded
# against existing releases, so an iteration number is never reused and no
# existing release is ever touched.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── Checkout (builds the pushed working tree as-is) ──
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for the changelog

      # ── Compute release tag: <branch>.<iteration> ────────
      - name: Compute release tag (branch + iteration)
        id: version
        shell: pwsh
        run: |
          # Sanitize the branch name into a tag-safe form (slashes -> dashes).
          $branch = "${{ github.ref_name }}"
          $safe = ($branch -replace '[^A-Za-z0-9._-]', '-')
          $prefix = "${safe}."

          # Find the highest iteration already published for this branch.
          $iter = 0
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          foreach ($r in $releases) {
            $tag = $r.tagName
            if ($tag.StartsWith($prefix)) {
              $n = 0
              if ([int]::TryParse($tag.Substring($prefix.Length), [ref]$n) -and $n -gt $iter) {
                $iter = $n
              }
            }
          }
          $iter++

          # Guard: never reuse an existing tag (double safety).
          $tag = "$prefix$iter"
          while ($true) {
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { break }
            $iter++
            $tag = "$prefix$iter"
          }

          echo "BRANCH=$branch" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "ITERATION=$iter" >> $env:GITHUB_OUTPUT

      # ── Build a small changelog from recent commits ───────
      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $log = git log --oneline -15
          if (-not $log) { $log = @("Initial build") }
          $body = "## What's Changed`n`n" + ($log -join "`n")
          $body | Out-File -FilePath changelog.txt -Encoding utf8

      - name: Prepare release body
        id: body
        shell: bash
        run: |
          { echo 'releaseBody<<EOF'; cat changelog.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      # ── Sync a unique numeric version into project files ──
      # 1.0.0.<iteration> keeps every build's installer distinct (valid for
      # MSI/NSIS) without ever conflicting with the stable v1.0.0.
      - name: Sync version into project files
        shell: pwsh
        run: |
          $ver = "1.0.0.${{ steps.version.outputs.ITERATION }}"

          # Update tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $ver
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          # Update package.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          # Update ONLY the [package] version in Cargo.toml (not dependency versions)
          $lines = Get-Content src-tauri/Cargo.toml
          $inPackage = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[package\]') { $inPackage = $true }
            elseif ($lines[$i] -match '^\[') { $inPackage = $false }

            if ($inPackage -and $lines[$i] -match '^version\s*=') {
              $lines[$i] = "version = `"$ver`""
              break
            }
          }
          $lines | Set-Content src-tauri/Cargo.toml

      # ── Setup toolchains ─────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # ── Build with Tauri + publish a NEW release ─────────
      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.TAG }}
          releaseName: "JOR — ${{ steps.version.outputs.BRANCH }} #${{ steps.version.outputs.ITERATION }}"
          releaseBody: ${{ steps.body.outputs.releaseBody }}
          releaseDraft: false
          prerelease: true
