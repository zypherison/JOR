name: "Branch Auto Release"

# Builds the pushed branch for Windows AND Linux and publishes a BRAND-NEW
# GitHub release on every push to ANY branch. Releases are tagged
# "<branch>.<iteration>" (e.g. optimized-overhaul.1, optimized-overhaul.2) so
# they can never collide with or modify existing releases such as v1.0.0 or
# v2.0.4.
#
# A single `prepare` job computes the tag/version/changelog; the Windows job
# creates the release and the Linux job appends its packages to the same
# release. Runs are serialized per branch (concurrency group) and the tag is
# guarded against existing tags, so an iteration is never reused and no
# existing release is ever touched.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Shared: tag + version + changelog ────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.version.outputs.TAG }}
      BRANCH: ${{ steps.version.outputs.BRANCH }}
      ITERATION: ${{ steps.version.outputs.ITERATION }}
      RELEASE_BODY: ${{ steps.body.outputs.releaseBody }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for the changelog

      # Compute release tag: <branch>.<iteration>
      # Uses git ls-remote (already authenticated by actions/checkout) to find
      # the highest existing iteration for this branch — no gh CLI needed.
      - name: Compute release tag (branch + iteration)
        id: version
        shell: pwsh
        run: |
          # Sanitize the branch name into a tag-safe form (slashes -> dashes).
          $branch = "${{ github.ref_name }}"
          $safe = ($branch -replace '[^A-Za-z0-9._-]', '-')
          $prefix = "${safe}."
          $escaped = [regex]::Escape($prefix)

          # Highest iteration already published for this branch (from remote tags).
          $iter = 0
          $remoteTags = git ls-remote --tags origin 2>$null
          foreach ($line in $remoteTags) {
            if ($line -match "refs/tags/$escaped(\d+)$") {
              $n = [int]$matches[1]
              if ($n -gt $iter) { $iter = $n }
            }
          }
          $iter++

          # Guard: never reuse an existing tag (double safety).
          $tag = "$prefix$iter"
          while ($true) {
            $exists = git ls-remote --tags origin $tag 2>$null
            if (-not $exists) { break }
            $iter++
            $tag = "$prefix$iter"
          }

          if (-not $tag) { throw "Failed to compute a release tag" }
          echo "BRANCH=$branch" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "ITERATION=$iter" >> $env:GITHUB_OUTPUT
          # Exit explicitly so a stale native-command exit code can never fail the step.
          exit 0

      # Build a small changelog from recent commits.
      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $log = git log --oneline -15
          if (-not $log) { $log = @("Initial build") }
          $body = "## What's Changed`n`n" + ($log -join "`n")
          $body | Out-File -FilePath changelog.txt -Encoding utf8

      - name: Prepare release body
        id: body
        shell: bash
        run: |
          { echo 'releaseBody<<EOF'; cat changelog.txt; echo 'EOF'; } >> "$GITHUB_OUTPUT"

  # ── Windows build (creates the release) ──────────────────
  build-windows:
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      # 1.0.<iteration> is strict semver (required by tauri.conf.json), unique
      # per branch build, and never collides with the stable v1.0.0 / v2.0.4.
      - name: Sync version into project files
        shell: pwsh
        run: |
          $ver = "1.0.${{ needs.prepare.outputs.ITERATION }}"

          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $ver
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          $lines = Get-Content src-tauri/Cargo.toml
          $inPackage = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[package\]') { $inPackage = $true }
            elseif ($lines[$i] -match '^\[') { $inPackage = $false }
            if ($inPackage -and $lines[$i] -match '^version\s*=') {
              $lines[$i] = "version = `"$ver`""
              break
            }
          }
          $lines | Set-Content src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Reuse the compiled dependency tree across runs. Keyed on the committed
      # Cargo.lock (which the version-sync step does NOT touch), so the cache
      # only busts when dependencies change: every iteration of the same branch
      # hits it, and only the small `jor` crate itself is recompiled. Also
      # caches the cargo registry so crates aren't re-downloaded.
      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build & publish Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.TAG }}
          releaseName: "JOR — ${{ needs.prepare.outputs.BRANCH }} #${{ needs.prepare.outputs.ITERATION }}"
          releaseBody: ${{ needs.prepare.outputs.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true

  # ── Linux build (appends packages to the same release) ───
  build-linux:
    runs-on: ubuntu-22.04
    needs: [prepare, build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libssl-dev

      - name: Sync version into project files
        shell: pwsh
        run: |
          $ver = "1.0.${{ needs.prepare.outputs.ITERATION }}"

          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = $ver
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          $lines = Get-Content src-tauri/Cargo.toml
          $inPackage = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\[package\]') { $inPackage = $true }
            elseif ($lines[$i] -match '^\[') { $inPackage = $false }
            if ($inPackage -and $lines[$i] -match '^version\s*=') {
              $lines[$i] = "version = `"$ver`""
              break
            }
          }
          $lines | Set-Content src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Same Rust cache as the Windows job (separate cache entry per OS via
      # runner.os in the key). See the Windows job for details.
      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Uploads AppImage + deb + rpm to the release created by the Windows job.
      - name: Build & upload Linux release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.TAG }}
          releaseName: "JOR — ${{ needs.prepare.outputs.BRANCH }} #${{ needs.prepare.outputs.ITERATION }}"
          releaseBody: ${{ needs.prepare.outputs.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true
