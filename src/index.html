<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOR</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Ambient background elements -->
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient-grid"></div>

  <!-- Data Refresh Modal -->
  <div id="refresh-modal" class="modal-overlay">
    <div class="modal">
      <h2>🔄 Data Refresh</h2>
      <p>Reset all JOR data? This will clear your history and settings, starting you from scratch.</p>

      <div class="modal-actions">
        <button onclick="closeRefresh()" class="btn-cancel">Cancel</button>
        <button onclick="handleRefresh()" class="btn-danger">Confirm Reset</button>
      </div>
    </div>
  </div>

  <div id="launcher">
    <!-- Search Bar -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="search-pill">JOR</span>
      <input
        type="text"
        id="search-input"
        placeholder="Search everything..."
        spellcheck="false"
        autocomplete="off"
        autofocus
      >
    </div>

    <!-- Results -->
    <ul id="results"></ul>

    <!-- Footer -->
    <div class="footer">
      <div class="hints">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
      </div>
      <div class="brand-container">
        <img src="./logo.png" alt="JOR Logo" class="brand-logo" width="16" height="16">
        <span class="brand-name">JOR.</span>
      </div>
    </div>
  </div>

  <script type="module" src="./js/launcher.js"></script>
</body>
</html>
