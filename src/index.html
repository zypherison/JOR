<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOR</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="launcher-body">
  <!-- Ambient background elements -->
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient-grid"></div>

  <!-- Data Refresh Modal -->
  <div id="refresh-modal" class="modal-overlay">
    <div class="modal">
      <h2>Reset JOR?</h2>
      <p>This clears your history, settings, and index — everything starts fresh.</p>

      <div class="modal-actions">
        <button onclick="closeRefresh()" class="btn btn-ghost">Cancel</button>
        <button onclick="handleRefresh()" class="btn btn-danger">Reset Everything</button>
      </div>
    </div>
  </div>

  <div id="launcher">
    <!-- Search Bar -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-input"
        placeholder="Search apps, files… or type a path (C:\, ~/)"
        spellcheck="false"
        autocomplete="off"
        autofocus
      >
    </div>

    <!-- Results -->
    <ul id="results"></ul>

    <!-- Footer -->
    <div class="footer">
      <div class="hints">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>tab</kbd> autocomplete</span>
        <span><kbd>esc</kbd> close</span>
      </div>
      <div class="footer-right">
        <div class="brand-container">
          <img src="./logo.png" alt="JOR Logo" class="brand-logo" width="16" height="16">
          <span class="brand-name">JOR</span>
        </div>
        <button id="open-settings" class="btn-icon" title="Open Dashboard" aria-label="Open Dashboard">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/launcher.js"></script>
</body>
</html>
