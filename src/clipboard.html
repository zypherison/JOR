<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOR Clipboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Ambient background elements -->
  <div class="ambient ambient-b"></div>
  <div class="ambient-grid"></div>

  <div id="launcher" class="launcher-compact">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span class="search-pill pill-clip">CLIP</span>
      <input type="text" id="search-input" placeholder="Search history..." autocomplete="off" autofocus>
      <button id="clear-btn" class="btn-clear">Clear</button>
    </div>

    <ul id="results"></ul>

    <div class="footer">
      <div class="hints">
        <span><kbd>↑↓</kbd> navigate &nbsp; <kbd>↵</kbd> paste</span>
      </div>
      <div class="brand-container">
        <img src="./logo.png" alt="JOR Logo" class="brand-logo" width="16" height="16">
        <span class="brand-name">JOR Clip.</span>
      </div>
    </div>
  </div>

  <script type="module" src="./js/clipboard.js"></script>
</body>
</html>
